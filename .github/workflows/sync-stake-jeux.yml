# Synchronise le catalogue Stake (GraphQL) dans jeux.json.
# Une seule passe HTTP (Node fetch) — pas de Playwright / navigateur.
# Secret optionnel : STAKE_PROXY — si Cloudflare bloque le runner.
#
# Actions → « Sync Stake → jeux.json » → Run workflow

name: Sync Stake → jeux.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer les slots Stake (fetch uniquement)
        env:
          STAKE_FETCH_ONLY: "1"
          STAKE_PROXY: ${{ secrets.STAKE_PROXY }}
        run: node scripts/sync-stake-catalog.mjs

      - name: Commit & push si jeux.json a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeux.json
          if git diff --staged --quiet; then
            echo "Aucun nouveau jeu Stake (fichier inchangé)."
            exit 0
          fi
          git commit -m "chore: sync Stake slots into jeux.json"
          git push
