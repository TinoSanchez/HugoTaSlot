# Synchronise le catalogue Stake (GraphQL, catégorie "slots") dans jeux.json.
# Les runners GitHub sont hors France → contournement typique du blocage ANJ / TLS sur stake.com
#
# Déclenchement manuel : Actions → « Sync Stake → jeux.json » → Run workflow

name: Sync Stake → jeux.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Récupérer les slots Stake et fusionner
        run: node scripts/sync-stake-catalog.mjs

      - name: Commit & push si jeux.json a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeux.json
          if git diff --staged --quiet; then
            echo "Aucun nouveau jeu Stake (fichier inchangé)."
            exit 0
          fi
          git commit -m "chore: sync Stake slots into jeux.json"
          git push
