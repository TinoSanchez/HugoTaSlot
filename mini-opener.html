<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>HugoTaSlot · Mini Opener</title>
<link rel="icon" href="./assets/icon-hunt.svg" type="image/svg+xml">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    /* Couleur principale = NOIR, accents = bleu/violet (boutons). */
    --gold: #7F5A83;             /* Dusty Lavender : accent principal (CTA) */
    --gold-soft: #A188A6;        /* Dusty Mauve : highlight */
    --gold-glow: rgba(127,90,131,0.40);
    --green: #6FCF97;
    --green-soft: rgba(111,207,151,0.18);
    --red: #E07A8C;
    --cyan: #7FB7C7;
    --bg-dark: #020202;          /* Black absolu */
    --bg-mid: #0A0A0C;           /* Noir neutre */
    --bg-card: #131316;          /* Noir gris pour cards */
    --border: rgba(127,90,131,0.22);
    --text: #EDEEF2;
    --text-dim: #9DA2AB;         /* Cool Steel */
    --radius: 10px;
    --radius-sm: 6px;
    --t: 160ms ease;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(ellipse at top, #131316 0%, var(--bg-dark) 70%);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }
  body { padding: 14px 14px 18px; user-select: none; }

  .mo-header {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .mo-logo {
    width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #ffffff; font-weight: 800; font-size: 14px;
    box-shadow: 0 0 14px var(--gold-glow);
  }
  .mo-title-block { line-height: 1.1; }
  .mo-title { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; color: var(--gold); }
  .mo-sub {
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    color: var(--text-dim); letter-spacing: 1.5px; margin-top: 2px;
  }
  .mo-status {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    letter-spacing: 1px; padding: 4px 8px; border-radius: 999px;
    background: rgba(111,207,151,0.12); color: var(--green);
    border: 1px solid rgba(111,207,151,0.4);
    transition: var(--t);
  }
  .mo-status.warn { background: rgba(127,90,131,0.12); color: var(--gold); border-color: rgba(127,90,131,0.4); }
  .mo-status.err { background: rgba(224,122,140,0.12); color: var(--red); border-color: rgba(224,122,140,0.4); }

  .mo-hunt-name {
    font-size: 17px; font-weight: 700; color: var(--text);
    margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(255,255,255,0.05);
  }
  .mo-hunt-meta {
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--text-dim); letter-spacing: 0.6px;
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
  }
  .mo-hunt-meta span b { color: var(--gold); font-weight: 700; }

  .mo-progress-bar {
    height: 6px; border-radius: 999px; background: var(--bg-mid);
    overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border);
  }
  .mo-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold) 0%, var(--green) 100%);
    transition: width 250ms ease;
  }

  .mo-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 12px 14px;
    margin-bottom: 12px;
  }

  .mo-bonus-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .mo-img-frame {
    width: 60px; height: 60px; flex: 0 0 60px;
    background: var(--bg-dark); border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .mo-img-frame img { width: 100%; height: 100%; object-fit: cover; }
  .mo-img-placeholder { color: var(--text-dim); font-size: 24px; }
  .mo-bonus-info { flex: 1; min-width: 0; }
  .mo-bonus-name {
    font-size: 16px; font-weight: 700; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mo-bonus-prov {
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    color: var(--text-dim); letter-spacing: 1px; margin-top: 2px;
    text-transform: uppercase;
  }
  .mo-bonus-stake {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: var(--gold); font-weight: 700; margin-top: 4px;
  }
  .mo-bonus-kind {
    display: inline-block;
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    letter-spacing: 1px; padding: 2px 6px; border-radius: 4px;
  }
  .mo-bonus-kind.normal { color: var(--cyan); background: rgba(127,183,199,0.12); border: 1px solid rgba(127,183,199,0.3); }
  .mo-bonus-kind.super { color: var(--gold); background: rgba(127,90,131,0.12); border: 1px solid rgba(127,90,131,0.3); }
  .mo-bonus-kind.ultra { color: var(--red); background: rgba(224,122,140,0.12); border: 1px solid rgba(224,122,140,0.3); }

  .mo-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .mo-stat { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .mo-stat-label {
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase;
  }
  .mo-stat-val { font-weight: 700; font-size: 13px; color: var(--text); white-space: nowrap; }
  .mo-stat-val.gold { color: var(--gold); }
  .mo-stat-val.green { color: var(--green); }
  .mo-stat-val.red { color: var(--red); }
  .mo-stat-val.cyan { color: var(--cyan); }

  .mo-input-block { margin-bottom: 8px; }
  .mo-input-label {
    display: block;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--text-dim); letter-spacing: 2px;
    margin-bottom: 6px; text-transform: uppercase;
  }
  .mo-input {
    width: 100%; height: 50px;
    background: var(--bg-mid); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--gold);
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px; font-weight: 700;
    padding: 0 14px; outline: none; text-align: center;
    transition: var(--t);
  }
  .mo-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  .mo-actions { display: grid; grid-template-columns: 60px 1fr 60px; gap: 8px; margin-top: 10px; }
  .mo-btn {
    height: 46px; border-radius: var(--radius-sm); cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    letter-spacing: 1.5px; font-size: 13px;
    border: 1px solid var(--border); background: var(--bg-mid);
    color: var(--text);
    transition: var(--t);
    display: flex; align-items: center; justify-content: center;
  }
  .mo-btn:hover { background: #1f2733; transform: translateY(-1px); }
  .mo-btn.primary {
    background: linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 100%);
    color: #ffffff; border-color: var(--gold);
    box-shadow: 0 6px 20px var(--gold-glow);
  }
  .mo-btn.primary:hover { box-shadow: 0 8px 24px rgba(127,90,131,0.5); }
  .mo-btn.nav { font-size: 18px; }

  .mo-goto {
    width: 100%; margin-top: 8px; height: 40px;
    border-radius: var(--radius-sm); cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    letter-spacing: 1.5px; font-size: 12px;
    background: rgba(111,207,151,0.12);
    border: 1px solid var(--green);
    color: var(--green);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: var(--t);
  }
  .mo-goto:hover { background: rgba(111,207,151,0.22); }
  .mo-goto:disabled { opacity: 0.4; cursor: not-allowed; }

  .mo-hint {
    text-align: center; margin-top: 10px;
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    color: var(--text-dim); letter-spacing: 1px;
  }

  .mo-empty {
    background: var(--bg-card); border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 24px 16px; text-align: center;
  }
  .mo-empty-title { color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .mo-empty-msg { color: var(--text-dim); font-family: 'Share Tech Mono', monospace; font-size: 10px; line-height: 1.5; }

  .mo-toast {
    position: fixed; left: 50%; bottom: 16px;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 999px;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.5px; opacity: 0;
    transition: var(--t);
    z-index: 999;
  }
  .mo-toast.success { border-color: var(--green); color: var(--green); }
  .mo-toast.error { border-color: var(--red); color: var(--red); }
  .mo-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .mo-list { margin-top: 10px; max-height: 130px; overflow: auto; padding-right: 4px; }
  .mo-list::-webkit-scrollbar { width: 6px; }
  .mo-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }
  .mo-list-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: var(--radius-sm);
    cursor: pointer; border: 1px solid transparent;
    transition: var(--t);
  }
  .mo-list-item:hover { background: rgba(255,255,255,0.04); }
  .mo-list-item.active { background: rgba(127,90,131,0.08); border-color: rgba(127,90,131,0.3); }
  .mo-list-item.done { opacity: 0.55; }
  .mo-list-num {
    width: 22px; height: 22px; flex: 0 0 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; background: var(--bg-mid);
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--text-dim); font-weight: 700;
  }
  .mo-list-thumb {
    width: 22px; height: 22px; flex: 0 0 22px;
    border-radius: 5px; overflow: hidden; background: var(--bg-mid);
    border: 1px solid var(--border);
  }
  .mo-list-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mo-list-item.active .mo-list-num { background: var(--gold); color: #ffffff; }
  .mo-list-item.done .mo-list-num { background: rgba(111,207,151,0.18); color: var(--green); }
  .mo-list-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mo-list-win { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text-dim); }
  .mo-list-win.has-win { color: var(--green); font-weight: 700; }
</style>
</head>
<body>

<div class="mo-header">
  <div class="mo-logo">BH</div>
  <div class="mo-title-block">
    <div class="mo-title">MINI OPENER</div>
    <div class="mo-sub">PAR-DESSUS LE CASINO</div>
  </div>
  <div class="mo-status" id="mo-status">SYNC ON</div>
</div>

<div id="mo-content"></div>

<div class="mo-toast" id="mo-toast"></div>

<script>
'use strict';
(function () {
  const STORAGE_KEY = 'huntmaster_v2';
  const CHANNEL_NAME = 'hm-bh-sync';
  const TOAST_TIMER = { id: null };
  /** Catalogue slots (jeux.json), même source que le site — indispensable pour les vignettes si slot_image vide. */
  let catalogSlots = [];
  let catalogLoadPromise = null;

  const CASINO_CONFIG = {
    gamdom: { label: 'Gamdom', searchUrl: (q) => `https://gamdom.com/casino?tab=slots&search=${encodeURIComponent(q || '')}` },
    stake: { label: 'Stake', searchUrl: (q) => `https://stake.com/casino/group/slots?search=${encodeURIComponent(q || '')}` },
    roobet: { label: 'Roobet', searchUrl: (q) => `https://roobet.com/casino?search=${encodeURIComponent(q || '')}` },
    bitstarz: { label: 'BitStarz', searchUrl: (q) => `https://www.bitstarz.com/slots/all?search=${encodeURIComponent(q || '')}` },
    rollbit: { label: 'Rollbit', searchUrl: (q) => `https://rollbit.com/casino?search=${encodeURIComponent(q || '')}` },
    vibet: { label: 'Vibet', searchUrl: (q) => `https://vibet.com/casino?search=${encodeURIComponent(q || '')}` },
    celcius: { label: 'Celcius', searchUrl: (q) => `https://celcius.com/casino?search=${encodeURIComponent(q || '')}` },
    shuffle: { label: 'Shuffle', searchUrl: (q) => `https://shuffle.com/casino?search=${encodeURIComponent(q || '')}` },
    bcgame: { label: 'BC.Game', searchUrl: (q) => `https://bc.game/casino/slots?search=${encodeURIComponent(q || '')}` },
    duelbits: { label: 'Duelbits', searchUrl: (q) => `https://duelbits.com/casino/slots?search=${encodeURIComponent(q || '')}` },
    betfury: { label: 'Betfury', searchUrl: (q) => `https://betfury.io/casino/slots?search=${encodeURIComponent(q || '')}` },
    sportsbetio: { label: 'Sportsbet.io', searchUrl: (q) => `https://sportsbet.io/casino/games/slots?search=${encodeURIComponent(q || '')}` }
  };
  function getCasinoKey(raw) {
    const k = String(raw || '').toLowerCase();
    return CASINO_CONFIG[k] ? k : 'gamdom';
  }
  function buildCasinoSlotUrl(casinoKey, slotName) {
    return CASINO_CONFIG[getCasinoKey(casinoKey)].searchUrl(String(slotName || ''));
  }
  function isGamdomLegacyGamesUrl(u) {
    return /^https?:\/\/(?:[\w-]+\.)?gamdom\.com\/casino\/games\/.+/i.test(String(u || '').trim());
  }
  function isGamdomSeoCasinoUrl(u) {
    return /^https?:\/\/(?:[\w-]+\.)?gamdom\.com\/(?:[a-z]{2}(?:-[a-z]{2})?\/)?casino\/(?!games\/)[\w-]+\/?(?:[?#]|$)/i.test(String(u || '').trim());
  }
  function isGamdomDirectGameUrl(u) {
    return isGamdomLegacyGamesUrl(u) || isGamdomSeoCasinoUrl(u);
  }
  function isStakeDirectGameUrl(u) {
    return /^https?:\/\/(?:[\w-]+\.)?stake\.com\/casino\/games\/.+/i.test(String(u || '').trim());
  }
  function isDirectGamePlayUrl(u) {
    return isGamdomDirectGameUrl(u) || isStakeDirectGameUrl(u);
  }
  function isGamdomNonDirectStoredUrl(u) {
    const s = String(u || '').trim().toLowerCase();
    if (!s || !s.includes('gamdom.com')) return false;
    if (isGamdomSeoCasinoUrl(u)) return false;
    if (isGamdomLegacyGamesUrl(u)) return true;
    if (s.includes('tab=slots') || s.includes('/slots/search')) return true;
    return false;
  }
  function gamdomSlugifyPart(s) {
    try {
      return String(s || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[''′`´]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .replace(/-+/g, '-');
    } catch { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  }
  function gamdomLocalePathPrefix() {
    try {
      const lang = (navigator.language || 'fr-FR').toLowerCase();
      if (lang.startsWith('fr')) return 'fr-fr';
      if (lang.startsWith('en')) return 'en';
      if (lang.startsWith('de')) return 'de';
      if (lang.startsWith('es')) return 'es';
      return 'fr-fr';
    } catch { return 'fr-fr'; }
  }
  function gamdomSeoCasinoUrlFromNameProvider(nom, provider) {
    const a = gamdomSlugifyPart(nom);
    const b = gamdomSlugifyPart(provider);
    if (!a || !b) return '';
    const loc = gamdomLocalePathPrefix();
    return `https://gamdom.com/${loc}/casino/${a}-${b}`;
  }
  function getBonusGoToUrl(hunt, bonus) {
    const casino = getCasinoKey(hunt && hunt.casino);
    const customRaw = String((bonus && (bonus.gamdomUrl || bonus.gamdom_url)) || '').trim();
    if (/^https?:\/\//i.test(customRaw)) {
      if (casino !== 'gamdom' || !isGamdomNonDirectStoredUrl(customRaw)) return customRaw;
    }
    if (casino === 'gamdom') {
      const seoOnly = gamdomSeoCasinoUrlFromNameProvider(bonusSlotName(bonus), bonusSlotProvider(bonus));
      if (seoOnly) return seoOnly;
    }
    return buildCasinoSlotUrl(hunt && hunt.casino, bonusSlotName(bonus));
  }

  function getCurrencySymbol(code) {
    const map = { EUR: '€', USD: '$', GBP: '£', BTC: '₿', ETH: 'Ξ' };
    return map[String(code || '').toUpperCase()] || '€';
  }
  function fmtMoney(n, currency) {
    const v = Number(n || 0);
    const sym = getCurrencySymbol(currency);
    const sign = v < 0 ? '-' : '';
    const abs = Math.abs(v);
    const str = abs >= 100 ? abs.toFixed(2) : abs.toFixed(2);
    return `${sign}${str.replace('.', ',')}${sym}`;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /** Aligné sur index.html : http(s), chemins relatifs, data:image sécurisés. */
  function isSafeUrl(u) {
    if (!u) return false;
    const s = String(u).trim();
    if (!s) return false;
    if (/^https?:\/\//i.test(s)) return true;
    if (s.startsWith('/') || s.startsWith('./') || s.startsWith('../')) return true;
    if (/^data:image\/(png|jpe?g|gif|webp|svg\+xml);/i.test(s)) return true;
    return false;
  }
  function normalizeSlotImageUrl(raw) {
    let s = String(raw || '').trim();
    if (!s) return '';
    s = s.replace(/\\/g, '/');
    if (s.startsWith('//')) s = `https:${s}`;
    else if (!/^(https?:\/\/|data:image\/|\/|\.\/|\.\.\/)/i.test(s) && /^[a-z0-9.-]+\.[a-z]{2,}/i.test(s)) s = `https://${s}`;
    return s;
  }
  function normalizeBonusCompareName(s) {
    try {
      return String(s || '')
        .replace(/[\u2018\u2019\u02BC\uFF07]/g, "'")
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    } catch {
      return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }
  }
  function normalizeThumbForMatch(u) {
    try {
      const s = String(u || '').trim().toLowerCase();
      if (!s) return '';
      const noQ = s.split('?')[0].split('#')[0];
      return noQ.replace(/\/$/, '');
    } catch {
      return '';
    }
  }
  function pickBestCatalogMatchMini(candidates) {
    if (!candidates || !candidates.length) return null;
    const withImg = candidates.filter((s) => String(s.image || s.img || s.thumbnail || '').trim());
    const pool = withImg.length ? withImg : candidates;
    const withDirect = pool.filter((s) => isDirectGamePlayUrl(s?.gamdomUrl || s?.gamdom_url));
    return (withDirect.length ? withDirect : pool)[0];
  }
  function findCatalogSlotForBonusMini(bonus) {
    if (!bonus || !Array.isArray(catalogSlots) || !catalogSlots.length) return null;
    const sid = String(bonus.slotId || bonus.slot_id || '').trim();
    if (sid) {
      const byId = catalogSlots.find((s) => String(s.id || s.Id || '') === sid);
      if (byId) return byId;
      if (!sid.startsWith('gd_')) {
        const prefixed = catalogSlots.find((s) => String(s.id || s.Id || '') === `gd_${sid}`);
        if (prefixed) return prefixed;
      }
    }
    const nameNorm = normalizeBonusCompareName(bonus.slotName || bonus.slot_name || '');
    const provNorm = normalizeBonusCompareName(bonus.slotProvider || bonus.provider || '');
    const thumbNorm = normalizeThumbForMatch(bonus.slotImage || bonus.slot_image || '');
    if (nameNorm) {
      const nameHits = catalogSlots.filter((s) => normalizeBonusCompareName(s.nom || s.name || s.title || s.Name || '') === nameNorm);
      if (nameHits.length) {
        const provHits = provNorm
          ? nameHits.filter((s) => {
              const p = normalizeBonusCompareName(s.provider || s.Provider || '');
              return !p || p === provNorm;
            })
          : nameHits;
        const pool = provHits.length ? provHits : nameHits;
        const picked = pickBestCatalogMatchMini(pool);
        if (picked) return picked;
      }
    }
    if (thumbNorm) {
      for (let i = 0; i < catalogSlots.length; i++) {
        const s = catalogSlots[i];
        const sim = normalizeThumbForMatch(s.image || s.img || s.thumbnail || '');
        if (sim && sim === thumbNorm) return s;
      }
    }
    return null;
  }
  function loadCatalogSlots() {
    if (catalogLoadPromise) return catalogLoadPromise;
    catalogLoadPromise = (async () => {
      const paths = ['jeux.json', './jeux.json', '/jeux.json'];
      for (const p of paths) {
        try {
          const r = await fetch(p, { cache: 'force-cache' });
          if (!r.ok) continue;
          const data = await r.json();
          const arr = Array.isArray(data) ? data : (data.slots || data.games || []);
          if (arr && arr.length) {
            catalogSlots = arr;
            return catalogSlots.length;
          }
        } catch (e) {
          console.warn('mini-opener jeux.json', p, e);
        }
      }
      return 0;
    })();
    return catalogLoadPromise;
  }
  /** URL vignette : bonus puis entrée jeux.json (comme index.html / resolveBonusImageUrl). */
  function resolveBonusImageUrlMini(bonus) {
    const direct = normalizeSlotImageUrl(
      bonus && (bonus.slotImage || bonus.slot_image || bonus.image || '')
    );
    if (direct && isSafeUrl(direct)) return direct;
    const cat = findCatalogSlotForBonusMini(bonus);
    if (cat) {
      const fromCat = normalizeSlotImageUrl(cat.image || cat.img || cat.thumbnail || '');
      if (fromCat && isSafeUrl(fromCat)) return fromCat;
    }
    return '';
  }
  function bonusSlotName(b) {
    return (b && (b.slotName || b.slot_name)) || '';
  }
  function bonusSlotProvider(b) {
    return (b && (b.slotProvider || b.provider)) || '';
  }
  function normalizeBonusType(t) {
    const v = String(t || '').toLowerCase();
    if (v === 'super' || v === 'ultra') return v;
    return 'normal';
  }
  function formatBonusKind(k) {
    if (k === 'super') return 'SUPER';
    if (k === 'ultra') return 'ULTRA';
    return 'NORMAL';
  }

  // ─── State ──────────────────────────────────────
  const state = {
    hunts: [],
    activeHuntId: null,
    bonusIndex: 0,
    saveTimer: null,
    suppressNextStorage: false,
    lastTouchedAt: 0
  };

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { state.hunts = []; state.activeHuntId = null; return; }
      const parsed = JSON.parse(raw);
      state.hunts = Array.isArray(parsed.hunts) ? parsed.hunts : [];
      state.activeHuntId = parsed.activeHuntId || null;
    } catch (e) { console.warn('mini-opener load fail', e); }
  }

  function activeHunt() {
    if (!state.activeHuntId) return null;
    return state.hunts.find((h) => h && h.id === state.activeHuntId) || null;
  }

  function pickInitialBonusIndex(hunt) {
    if (!hunt || !Array.isArray(hunt.bonuses) || !hunt.bonuses.length) return 0;
    const firstPending = hunt.bonuses.findIndex((b) => b && (b.win === null || typeof b.win === 'undefined'));
    return firstPending >= 0 ? firstPending : 0;
  }

  function clampIndex(idx, len) {
    if (!len) return 0;
    return Math.max(0, Math.min(idx, len - 1));
  }

  function persistAndBroadcast(reason) {
    try {
      const payload = {
        hunts: state.hunts,
        activeHuntId: state.activeHuntId
      };
      // Préserver les autres clés existantes (catalogMode, bonusView)
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            payload.catalogMode = parsed.catalogMode;
            payload.bonusView = parsed.bonusView;
          }
        }
      } catch (_) {}
      state.suppressNextStorage = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      try { localStorage.setItem('huntmaster_v2_synced', '0'); } catch (_) {}
      state.lastTouchedAt = Date.now();
      try {
        if (window.__bc) window.__bc.postMessage({ type: 'hunt-mutation', source: 'mini', reason: reason || 'edit', at: state.lastTouchedAt });
      } catch (_) {}
    } catch (e) { console.warn('mini-opener save fail', e); }
  }

  function debouncedPersist(reason) {
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => persistAndBroadcast(reason), 220);
  }

  function showToast(msg, kind, dur) {
    const el = document.getElementById('mo-toast');
    if (!el) return;
    el.className = 'mo-toast show ' + (kind || '');
    el.textContent = msg;
    if (TOAST_TIMER.id) clearTimeout(TOAST_TIMER.id);
    TOAST_TIMER.id = setTimeout(() => { el.className = 'mo-toast ' + (kind || ''); }, Math.max(800, dur || 1800));
  }

  function setStatus(text, kind) {
    const el = document.getElementById('mo-status');
    if (!el) return;
    el.className = 'mo-status' + (kind ? ' ' + kind : '');
    el.textContent = text;
  }

  // ─── Render ─────────────────────────────────────
  function render() {
    const root = document.getElementById('mo-content');
    if (!root) return;
    const hunt = activeHunt();
    if (!hunt) {
      root.innerHTML = `
        <div class="mo-empty">
          <div class="mo-empty-title">AUCUN HUNT ACTIF</div>
          <div class="mo-empty-msg">Sélectionne un hunt sur le site<br>HugoTaSlot pour démarrer.</div>
        </div>`;
      return;
    }
    const bonuses = Array.isArray(hunt.bonuses) ? hunt.bonuses : [];
    if (!bonuses.length) {
      root.innerHTML = `
        <div class="mo-hunt-name">${escapeHtml(hunt.name || 'Hunt')}</div>
        <div class="mo-empty">
          <div class="mo-empty-title">AUCUN BONUS</div>
          <div class="mo-empty-msg">Ajoute des bonus depuis le site,<br>ils apparaîtront ici en direct.</div>
        </div>`;
      return;
    }
    state.bonusIndex = clampIndex(state.bonusIndex, bonuses.length);
    const bonus = bonuses[state.bonusIndex];

    const totalStake = bonuses.reduce((s, b) => s + Number((b && b.stake) || 0), 0);
    const startBalance = Number(hunt.startBalance || 0);
    const completed = bonuses.filter((b) => b && b.win !== null && typeof b.win !== 'undefined');
    const currentWin = completed.reduce((s, b) => s + Number(b.win || 0), 0);
    const profit = currentWin - startBalance;
    const openedStake = completed.reduce((s, b) => s + Number((b && b.stake) || 0), 0);
    const remain = Math.max(0, startBalance - currentWin);
    const remainStake = Math.max(0, totalStake - openedStake);
    const beMult = totalStake > 0 ? (startBalance / totalStake) : 0;
    let beRemainTxt = '—';
    let beRemainCls = 'gold';
    if (remain <= 0.0001) { beRemainTxt = 'ATTEINT'; beRemainCls = 'green'; }
    else if (remainStake > 0) {
      const rm = remain / remainStake;
      beRemainTxt = rm.toFixed(4).replace('.', ',') + '×';
      beRemainCls = rm <= beMult ? 'gold' : 'red';
    } else { beRemainTxt = '∞×'; beRemainCls = 'red'; }

    const progressPct = startBalance > 0 ? Math.min(100, (currentWin / startBalance) * 100) : 0;
    const profitCls = profit >= 0 ? 'green' : 'red';
    const profitTxt = (profit >= 0 ? '+' : '') + fmtMoney(profit, hunt.currency);

    const imgResolved = resolveBonusImageUrlMini(bonus);
    const safeImg = imgResolved ? escapeHtml(imgResolved) : '';
    const kind = normalizeBonusType(bonus && (bonus.bonusType || bonus.bonus_type));

    const goUrl = getBonusGoToUrl(hunt, bonus);
    const canGo = !!goUrl;

    root.innerHTML = `
      <div class="mo-hunt-name">${escapeHtml(hunt.name || 'Hunt')}</div>
      <div class="mo-hunt-meta">
        <span>BONUS <b>${state.bonusIndex + 1}/${bonuses.length}</b></span>
        <span>FAITS <b>${completed.length}</b></span>
        <span>SOLDE <b>${escapeHtml(fmtMoney(startBalance, hunt.currency))}</b></span>
      </div>
      <div class="mo-progress-bar"><div class="mo-progress-fill" style="width:${progressPct.toFixed(1)}%"></div></div>

      <div class="mo-card">
        <div class="mo-bonus-head">
          <div class="mo-img-frame">
            ${safeImg
              ? `<img src="${safeImg}" alt="${escapeHtml(bonusSlotName(bonus))}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="this.parentElement.innerHTML='<div class=\\'mo-img-placeholder\\'>♠</div>'">`
              : `<div class="mo-img-placeholder">♠</div>`}
          </div>
          <div class="mo-bonus-info">
            <div class="mo-bonus-name">${escapeHtml(bonusSlotName(bonus) || 'Slot')}</div>
            <div class="mo-bonus-prov">${escapeHtml(bonusSlotProvider(bonus) || '—')}</div>
            <div class="mo-bonus-stake">MISE : ${escapeHtml(fmtMoney(bonus.stake, hunt.currency))}</div>
            <div class="mo-bonus-kind ${kind}">${formatBonusKind(kind)}</div>
          </div>
        </div>

        <div class="mo-stats">
          <div class="mo-stat"><span class="mo-stat-label">Gains</span><span class="mo-stat-val cyan">${escapeHtml(fmtMoney(currentWin, hunt.currency))}</span></div>
          <div class="mo-stat"><span class="mo-stat-label">Profit</span><span class="mo-stat-val ${profitCls}">${escapeHtml(profitTxt)}</span></div>
          <div class="mo-stat"><span class="mo-stat-label">BE moyen</span><span class="mo-stat-val gold">${beMult > 0 ? beMult.toFixed(2).replace('.', ',') + '×' : '—'}</span></div>
          <div class="mo-stat"><span class="mo-stat-label">BE évolutif</span><span class="mo-stat-val ${beRemainCls}">${escapeHtml(beRemainTxt)}</span></div>
        </div>

        <div class="mo-input-block" style="margin-top:12px">
          <label class="mo-input-label">GAIN DE CE BONUS</label>
          <input type="number" class="mo-input" id="mo-win-input" placeholder="0.00" step="0.01" min="0" autocomplete="off"
                 value="${bonus && bonus.win !== null && typeof bonus.win !== 'undefined' ? Number(bonus.win) : ''}">
          <div class="mo-actions">
            <button class="mo-btn nav" id="mo-prev" title="Précédent">⏪</button>
            <button class="mo-btn primary" id="mo-confirm">ENREGISTRER ↵</button>
            <button class="mo-btn nav" id="mo-next" title="Suivant">⏩</button>
          </div>
          <button class="mo-goto" id="mo-goto" ${canGo ? '' : 'disabled'}>↗  OUVRIR LE SLOT</button>
          <div class="mo-hint">ENTRÉE pour valider · ⏪ ⏩ pour naviguer</div>
        </div>
      </div>

      <div class="mo-card">
        <div class="mo-stat" style="margin-bottom:6px">
          <span class="mo-stat-label">Liste des bonus</span>
          <span class="mo-stat-val" style="font-size:11px;color:var(--text-dim)">${completed.length}/${bonuses.length}</span>
        </div>
        <div class="mo-list">
          ${bonuses.map((b, i) => {
            const has = b && b.win !== null && typeof b.win !== 'undefined';
            const cls = (i === state.bonusIndex ? 'active ' : '') + (has ? 'done' : '');
            return `<div class="mo-list-item ${cls}" data-idx="${i}">
                <div class="mo-list-num">${i + 1}</div>
                <div class="mo-list-thumb">${(() => {
                  const u = resolveBonusImageUrlMini(b);
                  return u ? `<img src="${escapeHtml(u)}" alt="" referrerpolicy="no-referrer" loading="lazy">` : '';
                })()}</div>
                <div class="mo-list-name">${escapeHtml(bonusSlotName(b) || 'Slot')}</div>
                <div class="mo-list-win ${has ? 'has-win' : ''}">${has ? escapeHtml(fmtMoney(b.win, hunt.currency)) : '—'}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
    `;

    bindControls();
  }

  function bindControls() {
    const inp = document.getElementById('mo-win-input');
    const btnConfirm = document.getElementById('mo-confirm');
    const btnPrev = document.getElementById('mo-prev');
    const btnNext = document.getElementById('mo-next');
    const btnGoto = document.getElementById('mo-goto');

    if (inp) {
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (_) {} }, 70);
      inp.addEventListener('input', () => {
        const hunt = activeHunt(); if (!hunt) return;
        const bonuses = hunt.bonuses || [];
        const b = bonuses[state.bonusIndex]; if (!b) return;
        const raw = String(inp.value || '').trim().replace(',', '.');
        if (raw === '') return;
        const v = parseFloat(raw);
        if (isNaN(v) || v < 0) return;
        b.win = v;
        debouncedPersist('input');
      });
      inp.addEventListener('blur', () => {
        if (state.saveTimer) { clearTimeout(state.saveTimer); state.saveTimer = null; }
        persistAndBroadcast('blur');
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doConfirm(); }
        else if (e.key === 'ArrowLeft' && (e.altKey || e.ctrlKey)) { e.preventDefault(); navigate(-1); }
        else if (e.key === 'ArrowRight' && (e.altKey || e.ctrlKey)) { e.preventDefault(); navigate(1); }
      });
    }
    if (btnConfirm) btnConfirm.addEventListener('click', doConfirm);
    if (btnPrev) btnPrev.addEventListener('click', () => navigate(-1));
    if (btnNext) btnNext.addEventListener('click', () => navigate(1));
    if (btnGoto) btnGoto.addEventListener('click', () => {
      const hunt = activeHunt(); if (!hunt) return;
      const b = (hunt.bonuses || [])[state.bonusIndex]; if (!b) return;
      const url = getBonusGoToUrl(hunt, b);
      if (!url) { showToast('Aucun lien casino', 'error'); return; }
      try { window.open(url, '_blank', 'noopener,noreferrer'); }
      catch (_) { showToast('Ouverture refusée', 'error'); }
    });
    document.querySelectorAll('.mo-list-item').forEach((el) => {
      el.addEventListener('click', () => {
        const i = parseInt(el.getAttribute('data-idx') || '0', 10);
        if (!isNaN(i)) { state.bonusIndex = i; render(); }
      });
    });
  }

  function readInputAndApply() {
    const hunt = activeHunt(); if (!hunt) return null;
    const bonuses = hunt.bonuses || [];
    const b = bonuses[state.bonusIndex]; if (!b) return null;
    const inp = document.getElementById('mo-win-input');
    if (!inp) return b;
    const raw = String(inp.value || '').trim().replace(',', '.');
    if (raw === '') return b;
    const v = parseFloat(raw);
    if (isNaN(v) || v < 0) return b;
    if (b.win !== v) {
      b.win = v;
      persistAndBroadcast('confirm');
    }
    return b;
  }

  function doConfirm() {
    const hunt = activeHunt(); if (!hunt) return;
    const bonuses = hunt.bonuses || [];
    const b = readInputAndApply();
    if (!b) return;
    const next = bonuses.findIndex((bb, i) => i > state.bonusIndex && (bb.win === null || typeof bb.win === 'undefined'));
    if (next >= 0) state.bonusIndex = next;
    else state.bonusIndex = clampIndex(state.bonusIndex + 1, bonuses.length);
    showToast('Gain enregistré', 'success', 1100);
    render();
  }

  function navigate(dir) {
    const hunt = activeHunt(); if (!hunt) return;
    const bonuses = hunt.bonuses || [];
    readInputAndApply();
    state.bonusIndex = clampIndex(state.bonusIndex + dir, bonuses.length);
    render();
  }

  // ─── Sync entrante (autres fenêtres) ────────────
  function refreshFromExternal() {
    const prevIdx = state.bonusIndex;
    loadFromStorage();
    const hunt = activeHunt();
    if (hunt && Array.isArray(hunt.bonuses)) {
      state.bonusIndex = clampIndex(prevIdx, hunt.bonuses.length);
    }
    render();
  }

  function setupSync() {
    try {
      const bc = new BroadcastChannel(CHANNEL_NAME);
      window.__bc = bc;
      bc.onmessage = (ev) => {
        const data = ev && ev.data;
        if (!data) return;
        if (data.source === 'mini') return;
        if (data.type === 'hunt-mutation' || data.type === 'state-replaced' || data.type === 'active-hunt-changed') {
          refreshFromExternal();
        }
      };
    } catch (_) { /* BroadcastChannel non dispo : fallback storage event */ }
    window.addEventListener('storage', (ev) => {
      if (state.suppressNextStorage) { state.suppressNextStorage = false; return; }
      if (ev.key === STORAGE_KEY) refreshFromExternal();
    });
    window.addEventListener('beforeunload', () => {
      try { if (state.saveTimer) { clearTimeout(state.saveTimer); persistAndBroadcast('beforeunload'); } } catch (_) {}
      try { if (window.__bc) window.__bc.close(); } catch (_) {}
    });
  }

  function init() {
    loadFromStorage();
    const hunt = activeHunt();
    state.bonusIndex = pickInitialBonusIndex(hunt);
    setStatus('SYNC ON');
    render();
    setupSync();
    loadCatalogSlots()
      .then((n) => {
        if (n > 0) {
          setStatus('SYNC ON');
          render();
        }
      })
      .catch(() => {});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
</html>
